<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宜蘭兩天一夜｜9/12–9/13 旅遊手冊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF3EF; --ink:#17332A; --muted:#5E736A; --line:#D3E0D8; --card:#FFFFFF;
  --sea:#2C6E91; --boba:#7A5230; --sun:#E8B23A;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 0 64px}

/* ---------- hero + map ---------- */
.hero{padding:26px 20px 6px}
.hero h1{font-family:var(--serif);font-weight:900;font-size:30px;line-height:1.2;margin:0 0 6px;letter-spacing:.02em}
.hero p{margin:0;color:var(--muted);font-size:14px}
.hero p b{color:var(--ink);font-weight:500}
.legend{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--muted);margin:10px 0 0}
.legend i{display:inline-block;width:18px;border-top:3px dashed;vertical-align:middle;margin-right:5px}
.legend .l1 i{border-color:var(--sea)} .legend .l2 i{border-color:var(--boba)}
.legend button{margin-left:auto;background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font:12px var(--sans);color:var(--muted);cursor:pointer}
.mapbox{margin:8px 12px 0;background:#CFE3EC;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.mapbox.hide{display:none}
.mapbox svg{display:block;width:100%;height:auto;user-select:none}
.route{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 5;opacity:.22;transition:opacity .25s}
.route.on{opacity:1}
.route.r1{stroke:var(--sea)} .route.r2{stroke:var(--boba)}
.route.alt{stroke-width:2;stroke-dasharray:2 5}
.pin{cursor:pointer}
.pin circle{fill:var(--sea);stroke:#fff;stroke-width:2.5;transition:fill .2s,stroke .2s}
.pin.p2 circle{fill:var(--boba)}
.pin.opt circle{fill:#fff;stroke:var(--boba);stroke-dasharray:3 2}
.pin.opt text{fill:var(--boba)}
.pin.done circle{fill:var(--sun)}
.pin.sel circle{stroke:var(--sun);stroke-width:4}
.pin text{fill:#fff;font:700 11px var(--sans);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.lbl{font:500 11px var(--sans);fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.geo{font:11px var(--sans);fill:#7E93A0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 8px;display:flex;gap:8px}
.tab{flex:1;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 4px;font:500 14px/1.25 var(--sans);color:var(--muted);cursor:pointer}
.tab small{display:block;font-size:11px;font-weight:400}
.tab[aria-selected=true]{color:#fff;border-color:transparent}
.tab.t1[aria-selected=true]{background:var(--sea)}
.tab.t2[aria-selected=true]{background:var(--boba)}
.tab.tm[aria-selected=true]{background:var(--ink)}
.tab:focus-visible,.head:focus-visible,.pin:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ---------- timeline ---------- */
.panel{display:none;padding:4px 12px 0}
.panel.on{display:block}
.dayhead{font-family:var(--serif);font-size:19px;font-weight:600;margin:10px 4px 8px}
.dayhead span{font-family:var(--sans);font-size:13px;color:var(--muted);margin-left:8px;font-weight:400}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:65px;top:16px;bottom:16px;border-left:2px dashed var(--line)}
.stop{display:grid;grid-template-columns:44px 28px 1fr;column-gap:8px;margin:0 0 4px}
.stop .t{font-size:13px;font-weight:500;color:var(--muted);text-align:right;padding-top:13px}
.stop.now .t{color:var(--ink);font-weight:700}
.stop.now .t::after{content:"現在";display:block;font-size:10px;font-weight:500;color:var(--sun)}
.num{width:26px;height:26px;border-radius:50%;background:var(--sea);color:#fff;font:700 12px var(--sans);display:grid;place-items:center;justify-self:center;margin-top:12px;position:relative;z-index:1;border:2px solid var(--bg)}
.p2 .num{background:var(--boba)}
.opt .num{background:#fff;color:var(--boba);border:2px dashed var(--boba)}
.stop.done .num{background:var(--sun);color:var(--ink);border-color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.opt .card{border-style:dashed;background:transparent}
.head{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px 11px 14px;background:none;border:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.name{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.3}
.name small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400}
.chev{margin-left:auto;flex:none;width:18px;height:18px;color:var(--muted);transition:transform .2s}
.stop.open .chev{transform:rotate(180deg)}
.body{display:none;padding:10px 14px 14px;border-top:1px solid var(--line)}
.stop.open .body{display:block}
.meta{font-size:13px;color:var(--muted);margin:0 0 6px;display:grid;gap:2px}
.meta div{display:flex;gap:6px}
.meta div span:first-child{flex:none}
.tips{margin:6px 0 12px;padding-left:18px}
.tips li{margin:4px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-block;padding:6px 12px;border-radius:999px;border:1px solid var(--sea);color:var(--sea);text-decoration:none;font-size:13px;font-weight:500;background:#fff}
.p2 .btn{border-color:var(--boba);color:var(--boba)}
.chk{margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--sun)}
.leg{grid-column:3;font-size:12px;color:var(--muted);padding:2px 0 8px 14px}
.leg::before{content:"↓ ";color:var(--line)}

/* ---------- memo ---------- */
.memo h2{font-family:var(--serif);font-size:17px;font-weight:600;margin:16px 4px 6px}
.memo ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.memo li{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.memo li:first-child{border-top:0}
.memo li label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;width:100%}
.memo input{width:18px;height:18px;margin-top:3px;flex:none;accent-color:var(--sun)}
.memo li.on{color:var(--muted);text-decoration:line-through}
.memo p{font-size:13px;color:var(--muted);margin:8px 6px 0}
.foot{font-size:12px;color:var(--muted);padding:26px 20px 0;text-align:center}
</style>
</head>

  before:['訂好週日北返火車票（16:30–18:30 宜蘭→台北的班次容易滿）','跟民宿確認入住／退房時間、鑰匙領取方式','預約奇麗灣珍奶 DIY 場次（Klook／KKday）','線上先買蘭陽動植物王國門票','出發前一天看氣象：9 月仍有颱風和午後雷陣雨'],
  pack:['現金（蔥油餅、夜市、動物飼料 50 元硬幣）','防曬、帽子、水壺','防蚊液（壯圍、烏石港戶外）','換洗衣物、拖鞋、盥洗用品','行動電源','雨具'],
  rain:['烏石港 → 改逛旁邊的蘭陽博物館（室內）','礁溪 → 改去泡湯：湯圍溝、礁溪溫泉公園森林風呂','動植物王國有大面積室內區，照常去','夜市 → 雨大就改羅東市區餐廳，宵夜外帶回民宿']
};

const state = {day:1, open:new Set(['a1']), done:new Set()};
const gmaps = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function stopHTML(s){
  const cls = ['stop', s.opt?'opt':'', state.open.has(s.key)?'open':'', state.done.has(s.key)?'done':''].join(' ');
  const meta = [
    s.hours ? `<div><span>🕘</span><span>${esc(s.hours)}</span></div>` : '',
    s.addr  ? `<div><span>📍</span><span>${esc(s.addr)}</span></div>` : ''
  ].join('');
  const tips = s.tips.map(t => `<li>${esc(t)}</li>`).join('');
  const leg = s.leg ? `<li class="stop"><div class="leg" style="grid-column:3">${esc(s.leg)}</div></li>` : '';
  return `<li class="${cls}" data-key="${s.key}">
    <div class="t">${s.time}</div>
    <div class="num">${s.pin==='nfa'?'+':s.pin}</div>
    <div class="card">
      <button class="head" type="button" aria-expanded="${state.open.has(s.key)}">
        <span class="name">${esc(s.name)}<small>${esc(s.sub)}</small></span>
        <svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8l5 5 5-5"/></svg>
      </button>
      <div class="body">
        <div class="meta">${meta}</div>
        <ul class="tips">${tips}</ul>
        <div class="acts">
          <a class="btn" href="${gmaps(s.q)}" target="_blank" rel="noopener">Google 地圖導航</a>
          <label class="chk"><input type="checkbox" ${state.done.has(s.key)?'checked':''}>到了</label>
        </div>
      </div>
    </div>
  </li>${leg}`;
}

function renderDay(d){
  document.getElementById('tl-'+d).innerHTML = STOPS.filter(s => s.day===d).map(stopHTML).join('');
}
function renderMemo(){
  for (const k in MEMO){
    document.getElementById('memo-'+k).innerHTML = MEMO[k].map((t,i) =>
      `<li><label><input type="checkbox"><span>${esc(t)}</span></label></li>`).join('');
  }
}
function syncPins(){
  document.querySelectorAll('.pin').forEach(p => {
    const id = p.dataset.pin;
    const mine = STOPS.filter(s => String(s.pin)===id);
    p.classList.toggle('done', mine.length>0 && mine.every(s => state.done.has(s.key)));
    p.classList.toggle('sel', mine.some(s => state.open.has(s.key) && s.day===state.day));
  });
  document.getElementById('r1').classList.toggle('on', state.day===1);
  document.getElementById('r2').classList.toggle('on', state.day===2);
  document.getElementById('r2alt').classList.toggle('on', state.day===2);
}
function selectDay(d){
  state.day = d;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.day===String(d))));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id==='panel-'+d));
  syncPins();
}
function toggleStop(key, force){
  const has = state.open.has(key);
  const want = force===undefined ? !has : force;
  if (want) state.open.add(key); else state.open.delete(key);
  const li = document.querySelector(`.stop[data-key="${key}"]`);
  if (li){ li.classList.toggle('open', want); li.querySelector('.head').setAttribute('aria-expanded', String(want)); }
  syncPins();
}

/* events */
document.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (!t) return;
  selectDay(t.dataset.day==='m' ? 'm' : Number(t.dataset.day));
});
document.querySelectorAll('.tl').forEach(tl => {
  tl.addEventListener('click', e => {
    const li = e.target.closest('.stop[data-key]'); if (!li) return;
    if (e.target.closest('.head')) toggleStop(li.dataset.key);
  });
  tl.addEventListener('change', e => {
    const li = e.target.closest('.stop[data-key]'); if (!li || !e.target.matches('.chk input')) return;
    if (e.target.checked) state.done.add(li.dataset.key); else state.done.delete(li.dataset.key);
    li.classList.toggle('done', e.target.checked);
    syncPins();
  });
});
document.querySelectorAll('.pin').forEach(p => {
  const go = () => {
    const id = p.dataset.pin;
    const mine = STOPS.filter(s => String(s.pin)===id);
    const s = mine.find(x => x.day===state.day) || mine[0]; if (!s) return;
    if (state.day!==s.day) selectDay(s.day);
    toggleStop(s.key, true);
    const li = document.querySelector(`.stop[data-key="${s.key}"]`);
    li && li.scrollIntoView({behavior:'smooth', block:'center'});
  };
  p.addEventListener('click', go);
  p.addEventListener('keydown', e => { if (e.key==='Enter' || e.key===' ') { e.preventDefault(); go(); } });
});
document.getElementById('mapToggle').addEventListener('click', e => {
  const box = document.getElementById('mapbox');
  const hide = !box.classList.contains('hide');
  box.classList.toggle('hide', hide);
  e.currentTarget.textContent = hide ? '展開地圖' : '收合地圖';
  e.currentTarget.setAttribute('aria-expanded', String(!hide));
});
document.querySelector('.memo').addEventListener('change', e => {
  const li = e.target.closest('li'); if (li) li.classList.toggle('on', e.target.checked);
});

/* auto-jump to today's stop during the trip */
function markNow(){
  const n = new Date();
  const key = `${n.getFullYear()}-${n.getMonth()+1}-${n.getDate()}`;
  const day = {'2026-9-12':1, '2026-9-13':2}[key];
  if (!day) return;
  const mins = n.getHours()*60 + n.getMinutes();
  const list = STOPS.filter(s => s.day===day && !s.opt);
  let cur = null;
  for (const s of list){ const [h,m] = s.time.split(':').map(Number); if (h*60+m <= mins) cur = s; }
  if (!cur) return;
  state.open.clear(); state.open.add(cur.key);
  renderDay(day); selectDay(day);
  const li = document.querySelector(`.stop[data-key="${cur.key}"]`);
  if (li){ li.classList.add('now'); }
}

renderDay(1); renderDay(2); renderMemo(); selectDay(1); markNow();
</script>
</body>
</html>
